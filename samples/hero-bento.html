<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { margin: 0; background: #0a0a0f; color: white; font-family: sans-serif; overflow: hidden; }
        .hero { position: relative; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 50px; }
        
        .content { text-align: center; margin-bottom: 40px; z-index: 10; }
        h1 { font-size: 4rem; margin: 0; }
        
        /* Bento Scroller */
        .bento-track {
            display: flex;
            gap: 20px;
            width: 100%;
            padding: 0 50px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }
        .bento-card {
            min-width: 300px;
            height: 400px;
            border-radius: 30px;
            overflow: hidden;
            position: relative;
            scroll-snap-align: center;
            transition: transform 0.3s;
        }
        .bento-card:hover { transform: translateY(-10px); }
        .bento-card img { width: 100%; height: 100%; object-fit: cover; }
        
        .wide { min-width: 500px; }
        
        .card-label {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="content">
            <h1>Discover Your Next Getaway</h1>
            <p>Scroll horizontally to explore</p>
        </div>
        
        <div class="bento-track">
            <div class="bento-card"><img src="../assets/goa.jpg"><div class="card-label">Goa</div></div>
            <div class="bento-card wide"><img src="../assets/hampi.jpg"><div class="card-label">Hampi Heritage</div></div>
            <div class="bento-card"><img src="../assets/araku.jpg"><div class="card-label">Araku Valley</div></div>
            <div class="bento-card wide"><img src="../assets/coorg.jpg"><div class="card-label">Coorg Escapes</div></div>
            <div class="bento-card"><img src="../assets/vizag.jpg"><div class="card-label">Vizag</div></div>
        </div>
    </div>
</body>
</html>
