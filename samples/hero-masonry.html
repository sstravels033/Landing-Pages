<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { margin: 0; background: #0a0a0f; color: white; font-family: sans-serif; overflow: hidden; }
        .hero { position: relative; height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        /* The Masonry Background */
        .masonry-bg {
            position: absolute;
            inset: -20%; /* Bleed past edges for parallax */
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            opacity: 0.4;
            transform: rotate(-10deg) scale(1.2);
            animation: panBg 30s linear infinite alternate;
        }
        .masonry-col { display: flex; flex-direction: column; gap: 20px; }
        .masonry-bg img { width: 100%; border-radius: 20px; object-fit: cover; }
        .tall { height: 400px; } .short { height: 250px; }
        
        @keyframes panBg {
            0% { transform: rotate(-10deg) scale(1.2) translateY(0); }
            100% { transform: rotate(-10deg) scale(1.2) translateY(-10%); }
        }

        .overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(10,10,15,0.2), #0a0a0f); }
        
        .content { position: relative; z-index: 10; text-align: center; }
        h1 { font-size: 5rem; margin: 0; }
    </style>
</head>
<body>
    <div class="hero">
        <div class="masonry-bg">
            <div class="masonry-col" style="margin-top: 50px;">
                <img src="../assets/goa.jpg" class="tall">
                <img src="../assets/hampi.jpg" class="short">
                <img src="../assets/coorg.jpg" class="tall">
            </div>
            <div class="masonry-col">
                <img src="../assets/up-heritage.jpg" class="short">
                <img src="../assets/araku.jpg" class="tall">
                <img src="../assets/gokarna.jpg" class="short">
            </div>
            <div class="masonry-col" style="margin-top: 100px;">
                <img src="../assets/vizag.jpg" class="tall">
                <img src="../assets/chirala.jpg" class="short">
                <img src="../assets/pondicherry.jpg" class="tall">
            </div>
            <div class="masonry-col" style="margin-top: -50px;">
                <img src="../assets/gandikota.jpg" class="short">
                <img src="../assets/warangal.jpg" class="tall">
                <img src="../assets/goa.jpg" class="short">
            </div>
        </div>
        <div class="overlay"></div>
        <div class="content">
            <h1>Immersive Travel</h1>
            <p>Every destination beautifully showcased.</p>
        </div>
    </div>
</body>
</html>
